<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La roux de chance</title>
<style>
body{margin:0;font-family:Arial;background:#eef2ff}
.top{background:#ffcc00;padding:14px;display:flex;align-items:center}
.top h2{margin:0 0 0 10px;color:#1e3a8a}
.title{color:#1e3a8a;text-align:center;margin:10px 0 0 0;font-size:28px}
.title b{color:#1e3a8a}
.wheel-wrap{position:relative;width:320px;height:320px;margin:15px auto}
#wheel{width:320px;height:320px;border-radius:50%;border:8px solid #c9a600;transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
.arrow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:35px solid #dc2626;z-index:5;margin-top:-145px}
.badge{position:absolute;top:-10px;right:-10px;background:gold;border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#1e3a8a;box-shadow:0 2px 8px rgba(0,0,0,.3);border:3px dashed #c9a600}
.card{margin:15px}
.btn{width:100%;padding:16px;border:none;border-radius:28px;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.btn1{background:#6d5a9a;color:#ffcc00}
.btn2{background:#6cb77c;color:#1e3a8a}
.btn3{background:#1e3a8a;color:#ffcc00;justify-content:center}
.small{font-size:13px;color:#1e3a8a;text-align:center;margin-top:15px}
.winners{background:white;margin:15px;border-radius:16px;padding:12px}
.w{ display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="top"><span style="font-size:22px">‹</span><h2>La roux de chance</h2></div>
<h2 class="title">La <b>roux de chance</b></h2>

<div style="position:relative;width:340px;margin:0 auto">
<div class="badge">+1<br><small>Spins</small></div>
<div class="wheel-wrap">
<div class="arrow"></div>
<canvas id="wheel" width="320" height="320"></canvas>
</div>
</div>

<p class="small">La roux de chance: Tournez la roue pour gagner des récompenses en CFA!</p>

<div class="card">
<button class="btn btn1" onclick="info()">How does it work <span>→</span></button>
<button class="btn btn2" onclick="invite()">Invite a Friend <span>→</span></button>
<button class="btn btn3" onclick="spin()">Spin now <span>→</span></button>
<p id="result" style="text-align:center;font-weight:bold;font-size:20px;color:#1e3a8a;min-height:25px"></p>
<button class="btn btn3" style="background:#16a34a" onclick="payer()">💰 PAYER 1,000F MIXX/MOOV</button>
</div>

<div class="winners">
<h3 style="margin:5px;color:#1e3a8a">🏆 Derniers gagnants</h3>
<div class="w"><span>Afi K.</span><b>5,000F</b></div>
<div class="w"><span>Koffi M.</span><b style="color:#dc2626">10,000F JACKPOT</b></div>
<div class="w"><span>Yaovi S.</span><b>2,000F</b></div>
</div>

<script>
let deg=0;
const c=document.getElementById('wheel'), ctx=c.getContext('2d');
const labels=['PERDU','PERDU','2,000F\n💵','3,000F\n💵','5,000F\n💵','10,000F\nJACKPOT\n💸'];
function draw(){
 for(let i=0;i<6;i++){
  ctx.beginPath();ctx.moveTo(160,160);
  ctx.arc(160,160,155,i*60*Math.PI/180,(i+1)*60*Math.PI/180);
  ctx.fillStyle=i%2==0?'#22c55e':'#7c6ec2'; ctx.fill();
  ctx.strokeStyle='#c9a600';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(160,160);ctx.rotate((i*60+30)*Math.PI/180);
  ctx.fillStyle='white';ctx.font='bold 13px Arial';
  let t=labels[i].split('\n'); t.forEach((line,j)=>ctx.fillText(line,40, j*15));
  ctx.restore();
 }
}draw();
function spin(){
 let r=Math.random()*100, idx=0, txt="";
 if(r<25)idx=0; else if(r<50)idx=1; else if(r<75)idx=2; else if(r<90)idx=3; else if(r<98)idx=4; else idx=5;
 deg+=1800+(360-idx*60)+30; c.style.transform=`rotate(${deg}deg)`;
 document.getElementById('result').innerText="...";
 setTimeout(()=>{
   if(idx<=1) txt="😢 PERDU";
   else if(idx==2) txt="GAGNÉ 2,000F 💵";
   else if(idx==3) txt="GAGNÉ 3,000F 💵";
   else if(idx==4) txt="GAGNÉ 5,000F 💵";
   else txt="👑 JACKPOT 10,000F 💸";
   document.getElementById('result').innerText=txt;
 },4100);
}
function payer(){window.open("https://pay.fedapay.com/roue-hedra-1000","_blank")}
function invite(){alert("Partage ton lien: https://adidohedra.github.io/Roux-herdra/")}
function info(){alert("Mise 1,000F - Tourne pour gagner jusqu'à 10,000F - 2 cases PERDU")}
</script>
</body>
</html>
