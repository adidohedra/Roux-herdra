<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La roux de chance</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}
.header{background:linear-gradient(90deg,#16a34a,#eab308,#dc2626);padding:18px}
.header h1{margin:0;font-size:26px;letter-spacing:1px}
.card{background:#1e293b;margin:15px;padding:15px;border-radius:16px}
.wheel-container{position:relative;width:300px;height:300px;margin:20px auto}
#wheel{width:280px;height:280px;border-radius:50%;border:8px solid gold;transition:transform 4s cubic-bezier(.17,.67,.12,.99);display:block;margin:0 auto}
.arrow{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:40px solid #eab308;z-index:10;filter:drop-shadow(0 2px 4px black)}
.center-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:55px;height:55px;background:gold;border:4px solid white;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;font-size:26px}
.btn{padding:16px;width:92%;border:none;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin:8px}
.btn-spin{background:#eab308;color:black}
.btn-pay{background:#16a34a;color:white}
.small{font-size:11px;color:#94a3b8;margin-top:8px}
.winner{ background:#334155; padding:10px; border-radius:10px; margin:6px 0; display:flex; justify-content:space-between; }
</style>
</head>
<body>

<div class="header">
<h1>🎡 La roux de chance</h1>
</div>

<div class="card">
<div class="wheel-container">
<div class="arrow"></div>
<canvas id="wheel" width="280" height="280"></canvas>
<div class="center-dot">🎯</div>
</div>
<p id="result" style="font-size:22px;font-weight:bold;min-height:30px;color:#eab308">Tourne la roue!</p>

<button class="btn btn-pay" onclick="payer()">💰 PAYER MIXX / MOOV</button>
<p class="small">18+ uniquement • Jeu responsable</p>
</div>

const colors=['#475569','#334155','#16a34a','#2563eb','#eab308','#dc2626'];

function drawWheel(){
 ctx.clearRect(0,0,280,280);
 for(let i=0;i<6;i++){
   ctx.beginPath();
   ctx.moveTo(140,140);
   ctx.arc(140,140,135,i*60*Math.PI/180,(i+1)*60*Math.PI/180);
   ctx.fillStyle=colors[i];
   ctx.fill();
   ctx.strokeStyle='#0f172a';ctx.lineWidth=3;ctx.stroke();
   ctx.save();
   ctx.translate(140,140);
   ctx.rotate((i*60+30)*Math.PI/180);
   ctx.fillStyle='white';
   ctx.font='bold 13px Arial';
   ctx.fillText(labels[i],35,5);
   ctx.restore();
 }
}
drawWheel();
